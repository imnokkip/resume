<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ name }} | {{ title }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="nav">
        <div class="container">
            <a href="#home" class="logo">{{ name.split()[0] }}</a>
            <div class="nav-links">
                <a href="#work">Работы</a>
                <a href="#skills">Навыки</a>
                <a href="#contact">Контакты</a>
                <a href="/admin" class="admin-link" target="_blank">
                    <i class="fas fa-cog"></i>
                </a>
                {% if session.logged_in %}
                <a href="/logout" class="admin-link">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <h3>{{ name }}</h3>
                    <p>{{ title }}</p>
                </div>
                <div>
                    <h4>Контакты</h4>
                    <div class="footer-links">
                        <a href="{{ github }}" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                        <a href="{{ kwork }}" target="_blank"><i class="fab fa-kickstarter-k"></i> Kwork</a>
                        <a href="tel:{{ phone }}"><i class="fas fa-phone"></i> {{ phone }}</a>
                        <a href="mailto:{{ email }}"><i class="fas fa-envelope"></i> {{ email }}</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© {{ name }} — {{ title }}</p>
            </div>
        </div>
    </footer>
</body>
</html>
